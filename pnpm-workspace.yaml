# pnpm: dependencias autorizadas a ejecutar scripts de build (feature de seguridad de pnpm).
# esbuild (usado por vite/vitest) necesita su script para preparar su binario nativo.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - postcss@8.5.18
  - nanoid@3.3.17
  - vitest@4.1.11
overrides:
  nanoid@<3.3.17: ^3.3.17
  vitest@3.2.6: ^4.1.11 
